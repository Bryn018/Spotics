name: Deploy to Railway (DISABLED - Using Railway autoDeploy instead)
on:
  workflow_dispatch: # Manual trigger only
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          check-latest: true
      - name: Show Node/NPM versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: |
          cd server
          npm ci
          cd ..
          npm ci
      - name: Build server
        run: |
          cd server
          npm run build
      - name: Build frontend
        run: |
          npm run build
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --ci
