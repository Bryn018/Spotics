name: Deploy to Railway

on:
  push:
    branches:
      - feature/fullstack-ready
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd .. && npm ci

      - name: Build server
        run: cd server && npm run build

      - name: Build frontend
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Configure Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          mkdir -p ~/.railway
          cat > ~/.railway/config.json << 'EOF'
          {
            "user": {
              "accessToken": "${{ secrets.RAILWAY_TOKEN }}",
              "refreshToken": "",
              "tokenExpiresAt": 0,
              "token": null
            },
            "projects": {
              "/home/runner/work/spotics/spotics": {
                "projectPath": "/home/runner/work/spotics/spotics",
                "name": "wonderful-determination",
                "project": "46451ed9-f824-4c07-92d5-ab39ac22a0ae",
                "environment": "848a9a7f-9c58-4d4b-b23c-f71a92172b4d",
                "environmentName": "production",
                "service": "281be3e2-7209-4015-b659-e08a6b7326cd"
              }
            },
            "linkedFunctions": {}
          }
          EOF
          chmod 600 ~/.railway/config.json
          railway whoami

      - name: Deploy to Railway
        run: railway up --ci
