name: Deploy to Railway

on:
  push:
    branches:
      - feature/fullstack-ready
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd .. && npm ci

      - name: Build server
        run: cd server && npm run build

      - name: Build frontend
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            -p 46451ed9-f824-4c07-92d5-ab39ac22a0ae \
            -s 281be3e2-7209-4015-b659-e08a6b7326cd \
            -e 848a9a7f-9c58-4d4b-b23c-f71a92172b4d
