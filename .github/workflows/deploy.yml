name: Deploy to Railway
on:
  push:
    branches: [ main, "feature/**" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: |
          cd server
          npm ci
          cd ../frontend
          npm ci
      - name: Build server
        run: |
          cd server
          npm run build
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g railway
          railway up --yes
