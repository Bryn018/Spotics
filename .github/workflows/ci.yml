name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck server
        run: cd server && npm run lint

      - name: Build server
        run: cd server && npm run build

      - name: Build frontend
        run: npm run build

      - name: Verify build outputs
        run: |
          test -f server/dist/index.js || (echo "Server build missing" && exit 1)
          test -f dist/index.html || (echo "Frontend build missing" && exit 1)
          echo "Build verified successfully"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/feature/fullstack-ready' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd .. && npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Configure Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          mkdir -p ~/.railway
          cat > ~/.railway/config.json << 'EOF'
{
  "user": {
    "accessToken": "${{ secrets.RAILWAY_TOKEN }}",
    "refreshToken": "",
    "tokenExpiresAt": 0
  },
  "projects": {
    "/home/runner/work/spotics/spotics": {
      "projectPath": "/home/runner/work/spotics/spotics",
      "name": "wonderful-determination",
      "project": "46451ed9-f824-4c07-92d5-ab39ac22a0ae",
      "environment": "848a9a7f-9c58-4d4b-b23c-f71a92172b4d",
      "environmentName": "production",
      "service": "281be3e2-7209-4015-b659-e08a6b7326cd"
    }
  },
  "linkedFunctions": {}
}
EOF
          chmod 600 ~/.railway/config.json
          railway whoami

      - name: Deploy to Railway
        run: railway up --ci
