name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Build
        env:
          LASTFM_API_KEY: ci-lastfm-key
          NEXTAUTH_SECRET: ci-nextauth-secret
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotics
        run: npm run build

      - name: Railway release script smoke check
        run: npm run railway:release -- --help || true
